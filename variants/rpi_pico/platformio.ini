; Plain Raspberry Pi Pico (RP2040, non-wireless) + Waveshare SX1262 HAT.
; board = pico, NOT rpipicow: the Pico W board routes LED_BUILTIN through the wireless chip.

[rpi_pico]
extends = rp2040_base
board = pico
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags = ${rp2040_base.build_flags}
  -I variants/rpi_pico
  -D P_LORA_DIO_1=20
  -D P_LORA_NSS=3
  -D P_LORA_RESET=15
  -D P_LORA_BUSY=2
  -D P_LORA_SCLK=10
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=11
  -D P_LORA_TX_LED=25
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=130
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=5
build_src_filter = ${rp2040_base.build_src_filter}
  +<../variants/rpi_pico>
lib_deps = ${rp2040_base.lib_deps}

[env:Pico_repeater]
extends = rpi_pico
build_flags = ${rpi_pico.build_flags}
  -D ADVERT_NAME='"Pico Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${rpi_pico.build_src_filter}
  +<../examples/simple_repeater>

; Companion firmware without a screen: use it with the MeshCore app or meshcore-cli over USB.
[env:Pico_companion_usb]
extends = rpi_pico
build_flags = ${rpi_pico.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
build_src_filter = ${rpi_pico.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${rpi_pico.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore = BLE

; Companion firmware with the terminal UI on an ST7789 240x240, a CardKB (optional)
; and one push button (GP6 to GND). The USB port still speaks the companion protocol.
[env:Pico_companion_term]
extends = rpi_pico
build_flags = ${rpi_pico.build_flags}
  -I examples/companion_radio/ui-term
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
  -D PICO_TERM_UI
  -D DISPLAY_CLASS=TermDisplay
  -D AUTO_OFF_MILLIS=0
  -D TFT_SCK=18
  -D TFT_MOSI=19
  -D TFT_CS=17
  -D TFT_DC=21
  -D TFT_RST=13
  -D TFT_BL=27
  -D TFT_W=240
  -D TFT_H=240
  -D TFT_SPI_MODE=SPI_MODE3
  -D TFT_SPI_HZ=24000000
  -D TERM_ROTATION=3
  -D TERM_FONT_SCALE=2
  -D TERM_BTN_PIN=6
  -D PIN_VBAT_READ=26
  -D ADC_MULTIPLIER=10230
build_src_filter = ${rpi_pico.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-term/*.cpp>
lib_deps = ${rpi_pico.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit GFX Library @ ^1.12.0
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
lib_ignore = BLE

; Same firmware on a 320x240 ST7796S panel (landscape). Wiring is the same pins as the ST7789 build;
; SDO/MISO can stay unconnected. TFT_VIS_W/H is the area the UI uses; the library itself is fixed at 320x480.
[env:Pico_companion_term_7796]
extends = rpi_pico
build_flags = ${rpi_pico.build_flags}
  -I examples/companion_radio/ui-term
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
  -D PICO_TERM_UI
  -D DISPLAY_CLASS=TermDisplay
  -D TFT_ST7796S
  -D TFT_SCK=18
  -D TFT_MOSI=19
  -D TFT_CS=17
  -D TFT_DC=21
  -D TFT_RST=13
  -D TFT_BL=27
  -D TFT_VIS_W=320
  -D TFT_VIS_H=240
  -D TFT_SPI_HZ=24000000
  -D TERM_ROTATION=1
  -D TERM_FONT_SCALE=2
  -D TERM_BTN_PIN=6
  -D PIN_VBAT_READ=26
  -D ADC_MULTIPLIER=10230
build_src_filter = ${rpi_pico.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-term/*.cpp>
lib_deps = ${rpi_pico.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit GFX Library @ ^1.12.0
  adafruit/Adafruit BusIO @ ^1.14.0
  https://github.com/prenticedavid/Adafruit_ST7796S_kbv.git
lib_ignore = BLE
